<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Dnyandip Vadane — AI/ML and Software Development</title>
  <desc id="desc">A burgundy animated developer banner with a technical grid and glowing accent path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset=".55" stop-color="#24101C"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E5B5C7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
      <animate attributeName="x1" values="-1;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#E5B5C7" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1020" cy="60" r="150" fill="#701A3D" opacity=".22"/>
  <circle cx="1020" cy="60" r="105" fill="none" stroke="#C77B9B" stroke-opacity=".28"/>
  <circle cx="1020" cy="60" r="72" fill="none" stroke="#C77B9B" stroke-opacity=".18" stroke-dasharray="5 9"/>
  <path d="M650 300 C760 210 810 330 930 235 S1080 205 1200 125" fill="none" stroke="url(#shine)" stroke-width="2.5" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0 1000;240 1000;0 1000" dur="8s" repeatCount="indefinite"/>
  </path>
  <text x="72" y="82" fill="#E5B5C7" font-family="monospace" font-size="15" letter-spacing="4">HELLO, WORLD / @DNYANDIP26</text>
  <text x="68" y="157" fill="#F8F0F3" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Dnyandip Vadane</text>
  <rect x="72" y="181" width="310" height="3" rx="1.5" fill="#C77B9B"/>
  <text x="72" y="222" fill="#F8F0F3" font-family="Arial, Helvetica, sans-serif" font-size="21">IT Engineering Student · AI/ML</text>
  <text x="72" y="256" fill="#E5B5C7" font-family="Arial, Helvetica, sans-serif" font-size="17">Generative AI / RAG / Data Analysis / Software</text>
  <text x="72" y="315" fill="#C77B9B" font-family="monospace" font-size="13" letter-spacing="2">BUILD • LEARN • ITERATE</text>
  <circle cx="1100" cy="282" r="5" fill="#E5B5C7"><animate attributeName="opacity" values=".3;1;.3" dur="2.5s" repeatCount="indefinite"/></circle>
</svg>
